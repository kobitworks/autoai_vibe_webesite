<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoAI Vibe Coding Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">AutoAI Child Project</p>
      <h1>Vibe Coding Lab</h1>
      <p>バイブコーディングで作る、小さなWebサイト／ミニWebアプリの実例集。</p>
    </div>
  </header>

  <main>
    <section class="summary">
      <div class="card metric"><span>親</span><strong>AutoAI</strong></div>
      <div class="card metric"><span>子</span><strong>バイブコーディングWeb開発</strong></div>
      <div class="card metric"><span>孫</span><strong id="projectCount">0 projects</strong></div>
    </section>

    <section>
      <div class="section-head">
        <div>
          <p class="eyebrow">Projects</p>
          <h2>孫プロジェクト</h2>
        </div>
        <p>最小仕様 → PoC → 操作確認 → 改善、の短いサイクルで増やしていきます。</p>
      </div>
      <div id="projectGrid" class="project-grid"></div>
    </section>
  </main>

  <footer>
    <p>AutoAI Vibe Coding Lab / GitHub Pages</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
