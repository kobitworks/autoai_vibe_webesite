<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>【AutoAI】Vibe Coding Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scanline"></div>
  <header class="topbar">
    <div>
      <p class="eyebrow">AUTOAI / CHILD PROJECT</p>
      <h1>VIBE CODING LAB</h1>
      <p class="lead">バイブコーディングで生み出す、小さなWebサイトとミニWebアプリの実験場。</p>
    </div>
    <div class="system-panel">
      <span class="lamp"></span>
      <div>
        <small>SYSTEM STATUS</small>
        <strong>ONLINE</strong>
      </div>
    </div>
  </header>

  <main>
    <section class="hud-grid">
      <article class="hud-card"><span>ROOT</span><strong>AutoAI</strong></article>
      <article class="hud-card"><span>PROJECT</span><strong>Vibe Coding Lab</strong></article>
      <article class="hud-card"><span>CHILD APPS</span><strong id="projectCount">0</strong></article>
    </section>

    <section class="mission-panel">
      <div class="panel-title">
        <div>
          <p class="eyebrow">PROJECT SELECT</p>
          <h2>孫プロジェクト一覧</h2>
        </div>
        <p>各サイトは <code>projects/プロジェクトID/</code> 配下に独立配置します。</p>
      </div>
      <div id="projectGrid" class="project-grid"></div>
    </section>
  </main>

  <footer>© AutoAI Vibe Coding Lab / GitHub Pages</footer>
  <script src="app.js"></script>
</body>
</html>
